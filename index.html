<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <title>Vertix Admin</title>
    <!-- Prévia de compartilhamento. O deploy é SPA (sem render no servidor) e
         os robôs não executam JS, então estas tags valem para todos os hosts:
         o conteúdo compartilhado do link de bio é sempre o mesmo. -->
    <meta
      name="description"
      content="Vertix — lojas Shopify que vendem e sistemas que resolvem."
    />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Vertix" />
    <meta property="og:title" content="Vertix — E-commerce &amp; Sistemas" />
    <meta
      property="og:description"
      content="Lojas Shopify que vendem e sistemas que resolvem. Somos Shopify Partners."
    />
    <meta property="og:image" content="https://bio.vertix.studio/og.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#0C0C0C" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
